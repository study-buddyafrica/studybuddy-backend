services:
    db:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - app_network

    redis:
        image: redis:8-alpine
        restart: unless-stopped
        ports:
            - "6379:6379"
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - app_network
    app:
        build: .
        develop:
            watch:
                - action: sync
                  path: ./
                  target: .
                  ignore:
                      - venv/
                      - .git/
                - action: rebuild
                  path: requirements.txt
        restart: unless-stopped
        command: >
            sh -c "python manage.py makemigrations &&
                python manage.py migrate && python manage.py seed_demo_data &&
                uvicorn config.asgi:application --host 0.0.0.0 --port 8000"
        volumes:
            - .:/backend
        ports:
            - "8000:8000"
        environment:
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_HOST: db
            DB_PORT: 5432
            REDIS_HOST: redis
            REDIS_PORT: 6379

        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - app_network

networks:
    app_network:
        driver: bridge

volumes:
    postgres_data:
