<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
</head>

<body>
    <!-- Logo -->
    <div style="text-align:center;">
        <img src="{{ logo_url }}" alt="Logo" width="120">
    </div>

    <!-- Greeting -->
    <p>Hi,</p>

    <!-- Message -->
    <p>You recently requested to reset your password. Use the code below to complete the process. This code is valid for
        {{ expires_in }} minutes.</p>

    <!-- Reset Code -->
    <div style="text-align:center; font-size: 24px; font-weight: bold; margin: 20px 0;">
        {{ reset_code }}
    </div>

    <!-- Footer -->
    <p>If you did not request a password reset, please ignore this email.</p>

    <p>Thanks,<br />The StudyBuddy Team</p>
</body>

</html>
